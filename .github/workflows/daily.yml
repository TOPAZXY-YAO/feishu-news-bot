name: daily-finance-news

on:
  schedule:
    - cron: "56 23 * * *" # 北京时间 07:56，避开整点高峰降低排队延迟
  workflow_dispatch:
    inputs:
      test_only:
        description: "只发测试卡片（不推新闻）"
        type: boolean
        default: false
      preview:
        description: "预览模式：跳过去重推当前内容（含图表+AI解读），不更新去重状态"
        type: boolean
        default: false

concurrency:
  group: daily-finance-news
  cancel-in-progress: false

permissions:
  contents: write # 允许回写去重状态 state.json

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装图表依赖与中文字体
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q matplotlib

      - name: 推送财经早报
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ "${{ inputs.test_only }}" = "true" ]; then
            python feishu_news.py --test
          elif [ "${{ inputs.preview }}" = "true" ]; then
            python feishu_news.py --preview
          else
            python feishu_news.py
          fi

      - name: 持久化去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "去重状态无变化，跳过提交"
          else
            git commit -m "chore: update dedup state"
            git pull --rebase origin main || true
            git push
          fi
