name: paper-daily

on:
  schedule:
    - cron: "30 0 * * *" # 北京时间 08:30
  workflow_dispatch:
    inputs:
      test_only:
        description: "只发测试卡片（不推论文）"
        type: boolean
        default: false

permissions:
  contents: write # 回写去重状态 paper_state.json

concurrency:
  group: paper-daily
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 推送经管论文日报
        env:
          PAPER_WEBHOOK_URL: ${{ secrets.PAPER_WEBHOOK_URL }}
          PAPER_SECRET: ${{ secrets.PAPER_SECRET }}
        run: |
          if [ "${{ inputs.test_only }}" = "true" ]; then
            python paper_bot.py --test
          else
            python paper_bot.py
          fi

      - name: 持久化去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "去重状态无变化，跳过提交"
          else
            git commit -m "chore: update paper dedup state"
            git pull --rebase origin main || true
            git push
          fi
